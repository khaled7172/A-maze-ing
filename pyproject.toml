[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen-amazeing"
version = "1.0.0"
description = "Reusable maze generator using recursive DFS backtracker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["maze", "generator", "dfs", "algorithm"]

[project.urls]
Homepage = "https://github.com/mkhanji/a-maze-ing"

[tool.setuptools.packages.find]
where = ["."]
include = ["maze*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
